<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کاتالوگ زیرنویس</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #6b6b76);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif;
    line-height: 1.6;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--bg2);
  }
  h1 { font-size: 20px; font-weight: 700; }
  .count { color: var(--hint); font-size: 13px; }
  .search {
    width: 100%; margin-top: 10px; padding: 10px 14px;
    border: 0; border-radius: 12px;
    background: var(--bg2); color: var(--text);
    font: inherit; font-size: 15px;
  }
  .search:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }
  .chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    flex: none; border: 0; cursor: pointer; font: inherit; font-size: 14px;
    padding: 6px 14px; border-radius: 999px;
    background: var(--bg2); color: var(--text);
  }
  .chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }
  ul { list-style: none; padding: 0; }
  li.item {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--bg2);
  }
  .poster {
    flex: none; width: 52px; height: 72px; border-radius: 6px;
    background: var(--bg2); color: var(--hint);
    display: grid; place-items: center; font-size: 22px; font-weight: 700;
    object-fit: cover; overflow: hidden;
  }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 16px; font-weight: 600; direction: ltr; text-align: right; overflow-wrap: anywhere; }
  .meta { color: var(--hint); font-size: 13px; }
  .get {
    flex: none; border: 0; cursor: pointer; font: inherit; font-size: 14px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--btn); color: var(--btn-text);
  }
  .get:active { opacity: .8; }
  .empty { text-align: center; color: var(--hint); padding: 48px 16px; }
</style>
</head>
<body>
<header>
  <h1>کاتالوگ زیرنویس <span class="count" id="count"></span></h1>
  <input class="search" id="q" type="search" placeholder="جستجوی اسم فیلم یا سریال" aria-label="جستجو" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>
<ul id="list"></ul>
<p class="empty" id="empty" hidden>چیزی پیدا نشد. اسم را کوتاه‌تر یا انگلیسی بنویس.</p>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const TYPES = { all: "همه", movie: "فیلم", series: "سریال", show: "شو" };
  let items = [], type = "all", query = "";

  const $ = id => document.getElementById(id);

  function openLink(url) {
    if (tg && url.startsWith("https://t.me/")) tg.openTelegramLink(url);
    else if (tg) tg.openLink(url);
    else window.open(url, "_blank");
  }

  function norm(s) {
    // یکسان‌سازی ی/ک عربی و فارسی برای جستجو
    return String(s).toLowerCase().replace(/ي/g, "ی").replace(/ك/g, "ک").trim();
  }

  function render() {
    const q = norm(query);
    const shown = items.filter(it =>
      (type === "all" || it.type === type) &&
      (!q || norm(it.title).includes(q) || norm(it.title_fa || "").includes(q))
    );
    $("count").textContent = "(" + shown.length + ")";
    $("empty").hidden = shown.length > 0;
    const list = $("list");
    list.replaceChildren();
    for (const it of shown) {
      const li = document.createElement("li");
      li.className = "item";

      let poster;
      if (it.poster) {
        poster = document.createElement("img");
        poster.src = it.poster; poster.alt = ""; poster.loading = "lazy";
      } else {
        poster = document.createElement("div");
        poster.textContent = it.title.charAt(0).toUpperCase();
      }
      poster.className = "poster";

      const info = document.createElement("div");
      info.className = "info";
      const t = document.createElement("div");
      t.className = "title"; t.textContent = it.title;
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = [TYPES[it.type] || "", it.year || "", it.title_fa || ""].filter(Boolean).join("، ");
      info.append(t, m);

      const btn = document.createElement("button");
      btn.className = "get"; btn.textContent = "دریافت زیرنویس";
      btn.onclick = () => openLink(it.link);

      li.append(poster, info, btn);
      list.append(li);
    }
  }

  function renderChips() {
    const box = $("chips");
    for (const [key, label] of Object.entries(TYPES)) {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = label;
      b.setAttribute("aria-pressed", key === type);
      b.onclick = () => {
        type = key;
        box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
        render();
      };
      box.append(b);
    }
  }

  $("q").addEventListener("input", e => { query = e.target.value; render(); });

  renderChips();
  fetch("data.json")
    .then(r => r.json())
    .then(data => { items = data; render(); })
    .catch(() => {
      $("empty").hidden = false;
      $("empty").textContent = "لیست بارگذاری نشد. اینترنتت را بررسی کن و دوباره باز کن.";
    });
</script>
</body>
</html>
